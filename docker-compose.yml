services:
  # PostgreSQL Database
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: weather-bot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-weatherbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weatherbot123}
      POSTGRES_DB: ${POSTGRES_DB:-weatherbot}
      # Убеждаемся, что PostgreSQL слушает на всех интерфейсах
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weatherbot}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - weather-bot-network
    restart: unless-stopped

  # Backend (Telegram Bot)
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: weather-bot-backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      BOT_TOKEN: ${BOT_TOKEN}
      # Используем имя контейнера вместо имени сервиса для надежности (если DNS не работает)
      DATABASE_URL: postgresql://${POSTGRES_USER:-weatherbot}:${POSTGRES_PASSWORD:-weatherbot123}@weather-bot-postgres:5432/${POSTGRES_DB:-weatherbot}?schema=public
      WEATHER_API_KEY: ${WEATHER_API_KEY}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-${WEATHER_API_KEY}}
      WEATHER_API_PROVIDER: ${WEATHER_API_PROVIDER:-openweathermap}
      WEATHER_API_LANG: ${WEATHER_API_LANG:-ru}
      WEATHER_UNITS: ${WEATHER_UNITS:-metric}
      TZ: ${TZ:-Europe/Moscow}
      PORT: ${PORT:-3000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
      - "${API_PORT:-3001}:3001"
    networks:
      - weather-bot-network
    restart: unless-stopped
    volumes:
      # Монтируем prisma для миграций
      - ./packages/backend/prisma:/app/packages/backend/prisma
    command: >
      sh -c "
        echo '=== Starting Backend Service ===' &&
        echo 'Waiting for database connection...' &&
        # Используем имя контейнера напрямую (более надежно в Podman)
        POSTGRES_HOST=weather-bot-postgres &&
        echo \"Using PostgreSQL host: $$POSTGRES_HOST\" &&
        MAX_ATTEMPTS=90 &&
        ATTEMPT=0 &&
        # Используем имя контейнера для подключения
        until (timeout 2 bash -c \"cat < /dev/null > /dev/tcp/$$POSTGRES_HOST/5432\" 2>/dev/null && pg_isready -h $$POSTGRES_HOST -p 5432 -U ${POSTGRES_USER:-weatherbot} -t 1 > /dev/null 2>&1); do
          ATTEMPT=$$((ATTEMPT + 1)) &&
          if [ $$ATTEMPT -ge $$MAX_ATTEMPTS ]; then
            echo '' &&
            echo '=== ERROR: Database connection failed after 90 attempts (3 minutes) ===' &&
            echo 'Diagnostics:' &&
            echo \"  1. Using PostgreSQL host: $$POSTGRES_HOST\" &&
            echo '  2. Checking DNS resolution...' &&
            (getent hosts $$POSTGRES_HOST 2>&1 || echo '    DNS resolution failed') &&
            echo '  3. Checking TCP connection...' &&
            (timeout 2 bash -c \"cat < /dev/null > /dev/tcp/$$POSTGRES_HOST/5432\" 2>&1 && echo '    TCP connection OK' || echo '    TCP connection FAILED') &&
            echo '  4. Checking pg_isready...' &&
            (pg_isready -h $$POSTGRES_HOST -p 5432 -U ${POSTGRES_USER:-weatherbot} 2>&1 || echo '    pg_isready failed') &&
            echo '' &&
            echo 'Please check:' &&
            echo '  - PostgreSQL container is running: docker-compose ps' &&
            echo '  - PostgreSQL logs: docker-compose logs postgres' &&
            echo '  - Network connectivity: docker network inspect weather-bot-network' &&
            exit 1
          fi &&
          if [ $$((ATTEMPT % 15)) -eq 0 ]; then
            echo \"Attempt $$ATTEMPT/$$MAX_ATTEMPTS: Still waiting for database... (checking network connectivity)\"
          fi &&
          sleep 2
        done &&
        echo '' &&
        echo '=== Database is ready! ===' &&
        sleep 2 &&
        cd /app/packages/backend &&
        export PRISMA_ENGINES_MIRROR=https://binaries.prisma.sh &&
        export PRISMA_CLI_BINARY_TARGET=linux-musl-openssl-1.1.x &&
        echo 'Running database migrations...' &&
        pnpm prisma migrate deploy || echo 'Warning: Migration skipped or failed' &&
        echo 'Starting application...' &&
        node dist/index.js
      "

  # Frontend (Mini App)
  frontend:
    build:
      context: .
      dockerfile: apps/miniapp/Dockerfile
    container_name: weather-bot-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - weather-bot-network
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Переменные для сборки (если нужны)
      VITE_API_URL: ${VITE_API_URL:-/api}

networks:
  weather-bot-network:
    driver: bridge
    name: weather-bot-network
    # Явно указываем, что используем внутренний DNS
    internal: false

volumes:
  postgres_data:
    driver: local

