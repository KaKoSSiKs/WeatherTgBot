services:
  # PostgreSQL Database
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: weather-bot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-weatherbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weatherbot123}
      POSTGRES_DB: ${POSTGRES_DB:-weatherbot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weatherbot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - weather-bot-network
    restart: unless-stopped

  # Backend (Telegram Bot)
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: weather-bot-backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: postgresql://${POSTGRES_USER:-weatherbot}:${POSTGRES_PASSWORD:-weatherbot123}@postgres:5432/${POSTGRES_DB:-weatherbot}?schema=public
      WEATHER_API_KEY: ${WEATHER_API_KEY}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-${WEATHER_API_KEY}}
      WEATHER_API_PROVIDER: ${WEATHER_API_PROVIDER:-openweathermap}
      WEATHER_API_LANG: ${WEATHER_API_LANG:-ru}
      WEATHER_UNITS: ${WEATHER_UNITS:-metric}
      TZ: ${TZ:-Europe/Moscow}
      PORT: ${PORT:-3000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
      - "${API_PORT:-3001}:3001"
    networks:
      - weather-bot-network
    restart: unless-stopped
    volumes:
      # Монтируем prisma для миграций
      - ./packages/backend/prisma:/app/packages/backend/prisma
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        cd /app/packages/backend &&
        export PRISMA_ENGINES_MIRROR=https://binaries.prisma.sh &&
        export PRISMA_CLI_BINARY_TARGET=linux-musl-openssl-1.1.x &&
        pnpm prisma migrate deploy || echo 'Migration skipped or failed' &&
        node dist/index.js
      "

  # Frontend (Mini App)
  frontend:
    build:
      context: .
      dockerfile: apps/miniapp/Dockerfile
    container_name: weather-bot-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - weather-bot-network
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Переменные для сборки (если нужны)
      VITE_API_URL: ${VITE_API_URL:-/api}

networks:
  weather-bot-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

